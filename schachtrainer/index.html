<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schachtrainer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Schachtrainer</h1>
        <div class="controls">
          <button id="btn-new">Neue Partie</button>
          <button id="btn-undo">Zug zurück</button>
          <button id="btn-wissen" title="Schach-Wissen in eigenem Fenster öffnen">Wissen</button>
          <select id="sel-side">
            <option value="white" selected>Ich spiele Weiß</option>
            <option value="black">Ich spiele Schwarz</option>
          </select>
          <label class="strength">
            Stärke:
            <select id="sel-strength">
              <option value="skill:0" selected>Anfänger</option>
              <option value="skill:3">Leicht</option>
              <option value="skill:6">Mittel</option>
              <option value="skill:10">Fortgeschritten</option>
              <option value="elo:1600">Klub (1600)</option>
              <option value="elo:2000">Stark (2000)</option>
              <option value="skill:20">Maximal</option>
            </select>
          </label>
          <label class="hint-toggle">
            <input type="checkbox" id="chk-hint" checked />
            Tipp anzeigen
          </label>
          <label class="hint-toggle">
            <input type="checkbox" id="chk-speak" checked />
            Ansage
          </label>
          <label class="strength">
            Eröffnung:
            <select id="sel-opening">
              <option value="free" selected>Frei spielen</option>
              <option value="london">Londoner System</option>
              <option value="italienisch">Italienisch</option>
            </select>
          </label>
          <label class="hint-toggle">
            <input type="checkbox" id="chk-coach" />
            Trainer
          </label>
          <input id="coach-model" class="coach-model" type="text" value="llama3.1:8b" list="ollama-models" placeholder="llama3.1:8b" title="Ollama-Modell (leer = Standard)" />
          <datalist id="ollama-models"></datalist>
        </div>
      </header>

      <section class="board-wrapper">
        <div class="eval-col">
          <span id="evaltext" class="evaltext">±0.0</span>
          <div id="evalbar" class="evalbar" title="Bewertung">
            <div id="evalfill" class="evalfill"></div>
          </div>
        </div>
        <div id="board"></div>
      </section>

      <aside class="info">
        <div id="status">Am Zug: Weiß</div>
        <div id="engine-status" class="engine-status">Engine wird geladen…</div>
        <div id="blunder" class="blunder" hidden></div>
        <div id="hint" class="hint"></div>
        <div id="coach-wrap" class="coach-wrap" hidden>
          <div id="coach" class="coach"></div>
          <button id="btn-copy-coach" class="copy-btn" title="Trainer-Text in die Zwischenablage kopieren">Kopieren</button>
        </div>
        <div>
          <h2>Zugverlauf</h2>
          <ol id="moves"></ol>
        </div>

        <div class="pgn">
          <h2>PGN</h2>
          <div class="pgn-buttons">
            <button id="btn-save">Speichern</button>
            <button id="btn-load">Laden</button>
            <button id="btn-prev" title="Zurück">◀</button>
            <button id="btn-next" title="Vor">▶</button>
          </div>
          <textarea id="pgn-text" rows="6" placeholder="PGN hier einfügen und auf Laden klicken…"></textarea>
          <div id="pgn-status" class="pgn-status"></div>
        </div>
      </aside>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
