<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schachtrainer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Schachtrainer</h1>
        <div class="controls">
          <button id="btn-new">Neue Partie</button>
          <button id="btn-undo">Zug zurück</button>
          <select id="sel-side">
            <option value="white" selected>Ich spiele Weiß</option>
            <option value="black">Ich spiele Schwarz</option>
          </select>
        </div>
      </header>

      <section class="board-wrapper">
        <div id="board"></div>
      </section>

      <aside class="info">
        <div id="status">Am Zug: Weiß</div>
        <div>
          <h2>Zugverlauf</h2>
          <ol id="moves"></ol>
        </div>
      </aside>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
