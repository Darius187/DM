<html lang="de">
<head>

  <title>Ravensmoor · Echte Wände + Raumgefühl</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07070b; font-family: Georgia, 'Times New Roman', serif; }

<body>
  <div id="app"></div>
  <div id="hud">
    <h1>RAVENSMOOR · ECHTE WÄNDE + RAUMGEFÜHL</h1>
    <p>Zwei Räume mit hohen Steinwänden rundherum (vertikal UND horizontal,
       90°-Eckpfeiler), dazwischen ein Tor zum Nebenraum, ein Zaun-Gehege mit
