<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravensmoor · Prozeduraler Ritter (Test)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06060a; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; left: 18px; top: 14px; color: #e8dcc0; text-shadow: 0 2px 6px #000; pointer-events: none; }
    #hud h1 { margin: 0; font-size: 20px; letter-spacing: 3px; color: #e6c878; font-weight: 600; }
    #hud p { margin: 4px 0 0; font-size: 12.5px; color: #b8ac90; }
    #leiste { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; }
    #leiste button {
      font-family: inherit; font-size: 13px; letter-spacing: 1px; color: #e8dcc0;
      background: #1a140cdd; border: 1px solid #4a3a24; border-radius: 7px; padding: 8px 14px; cursor: pointer;
    }
    #leiste button:hover { background: #2a2010; border-color: #c9a227; }
    #leiste button.an { background: #3a2a12; border-color: #f0d060; color: #f6e6a8; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>RAVENSMOOR · PROZEDURALER RITTER</h1>
    <p>Aus Geometrie gebaut nach den Spiel-Vorgaben (Platte-Stufe) · Maus ziehen = drehen, Rad = zoomen</p>
  </div>
  <div id="leiste"></div>
  <script type="module" src="/src/demo3d/ritterShowcase.ts"></script>
</body>
</html>
