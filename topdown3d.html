<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravensmoor · 3D-Props in UNSEREM Top-Down</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #08070b; font-family: Georgia, 'Times New Roman', serif; }
    #view { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
    #hud { position: fixed; left: 16px; top: 12px; color: #e8dcc0; text-shadow: 0 2px 6px #000; pointer-events: none; max-width: 560px; }
    #hud h1 { margin: 0; font-size: 17px; letter-spacing: 2px; color: #e6c878; font-weight: 600; }
    #hud p { margin: 5px 0 0; font-size: 12.5px; color: #b8ac90; line-height: 1.45; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>RAVENSMOOR · 3D-PROPS ALS TOP-DOWN-SPRITES</h1>
    <p>Das ist KEIN neues 3D-Spiel - es ist unser normales Top-Down. three.js
       bäckt jedes Objekt (Palisade, Zaun, Erz, Truhe ...) einmal in ein Bild,
       das als flacher Sprite auf dem echten Spiel-Boden steht. Dazwischen läuft
       die gewohnte 2D-Helden-Figur.</p>
  </div>
  <script type="module" src="/src/demo3d/topdown3dSim.ts"></script>
</body>
</html>
