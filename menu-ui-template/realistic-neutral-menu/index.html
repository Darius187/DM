<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realistic Medieval Settings Menu</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="demo-stage">
      <button class="open-menu-button" id="openMenu" type="button">Einstellungen</button>

      <section class="settings-overlay" id="settingsOverlay" aria-label="Einstellungen">
        <div class="settings-frame" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
          <aside class="settings-tabs" id="settingsTabs" aria-label="Kategorien"></aside>

          <div class="settings-panel">
            <header class="settings-header">
              <span class="pin pin-left"></span>
              <h1 id="settingsTitle">Einstellungen</h1>
              <span class="seal" aria-hidden="true"></span>
            </header>

            <div class="settings-body">
              <section class="settings-column" id="leftColumn"></section>
              <div class="divider" aria-hidden="true"></div>
              <section class="settings-column settings-column-right" id="rightColumn"></section>
            </div>

            <footer class="settings-actions">
              <button class="action-button action-secondary" id="resetButton" type="button">
                <span class="action-mark" aria-hidden="true">+</span>
                Standard
              </button>
              <button class="action-button action-primary" id="backButton" type="button">
                <span class="action-mark" aria-hidden="true">&lt;</span>
                Zurueck
              </button>
            </footer>
          </div>
        </div>
      </section>
    </main>

    <script src="./menu.js"></script>
  </body>
</html>
