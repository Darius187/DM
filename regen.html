<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravensmoor · Regen & Pfützen (2D-Canvas)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; font-family: Georgia, 'Times New Roman', serif; }
    #view { position: fixed; inset: 0; display: block; }
    #hud { position: fixed; left: 16px; top: 12px; color: #e8dcc0; text-shadow: 0 2px 6px #000; pointer-events: none; max-width: 620px; }
    #hud h1 { margin: 0; font-size: 17px; letter-spacing: 2px; color: #8ab4d8; font-weight: 600; }
    #hud p { margin: 5px 0 0; font-size: 12.5px; color: #9aa8b8; line-height: 1.45; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>RAVENSMOOR · REGEN & PFÜTZEN</h1>
    <p>Reines 2D-Canvas (Phaser-fähig, kein fremder Code): nasses Pflaster,
       organische Pfützen mit Licht-Spiegelung, Regen mit Tiefenstaffelung,
       Tropfen-Ringe in den Pfützen, Spritzer auf dem Stein, gelegentlich ein
       Blitz. Maus bewegt die Laterne, Klick = großer Einschlag.</p>
  </div>
  <script type="module" src="/src/demo3d/regenSim.ts"></script>
</body>
</html>
